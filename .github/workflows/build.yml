name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive (unsigned)
        run: |
          xcodebuild archive \
            -project MiaoTing.xcodeproj \
            -scheme MiaoTing \
            -configuration Release \
            -archivePath build/MiaoTing.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -destination "generic/platform=iOS" \
            2>&1 | tee build_output.log

      - name: Create IPA from archive
        run: |
          # 直接从 .xcarchive 手动构建 IPA
          # Archive 结构: MiaoTing.xcarchive/Products/Applications/MiaoTing.app
          mkdir -p build/Payload
          cp -r build/MiaoTing.xcarchive/Products/Applications/MiaoTing.app build/Payload/
          
          # 移除现有签名（如果有）
          find build/Payload/MiaoTing.app -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          find build/Payload/MiaoTing.app -name "embedded.mobileprovision" -delete 2>/dev/null || true
          
          cd build
          zip -r MiaoTing-1.1.3-unsigned.ipa Payload
          ls -la MiaoTing-1.1.3-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiaoTing-1.1.3-unsigned
          path: build/MiaoTing-1.1.3-unsigned.ipa
          retention-days: 90

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_output.log
            build/
          retention-days: 7
