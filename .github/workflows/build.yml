name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build .app (unsigned, no archive)
        run: |
          # 不用 archive，直接 build 到 build 目录
          xcodebuild build \
            -project MiaoTing.xcodeproj \
            -scheme MiaoTing \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -destination "generic/platform=iOS" \
            2>&1 | tee build_output.log

      - name: Create IPA
        run: |
          # 查找编译出来的 .app
          echo "=== Searching for .app ==="
          find build/DerivedData -name "MiaoTing.app" -type d
          
          APP_PATH=$(find build/DerivedData -name "MiaoTing.app" -type d | head -1)
          echo "Found: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            echo "=== BuildProductsPath ==="
            find build/DerivedData -type d -name "BuildProductsPath" 2>/dev/null
            find build/DerivedData/Build -maxdepth 3 -type d 2>/dev/null
            exit 1
          fi
          
          # 构建 IPA
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/MiaoTing.app
          
          # 清除签名
          rm -rf build/Payload/MiaoTing.app/_CodeSignature 2>/dev/null || true
          rm -f build/Payload/MiaoTing.app/embedded.mobileprovision 2>/dev/null || true
          
          cd build
          zip -r MiaoTing-1.1.3-unsigned.ipa Payload
          echo "=== IPA created ==="
          ls -la MiaoTing-1.1.3-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiaoTing-1.1.3-unsigned
          path: build/MiaoTing-1.1.3-unsigned.ipa
          retention-days: 90

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_output.log
            build/
          retention-days: 7
