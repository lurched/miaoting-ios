name: MiaoTing
options:
  bundleIdPrefix: com.syncrozero
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.1.3"
    CURRENT_PROJECT_VERSION: "113"
    PRODUCT_BUNDLE_IDENTIFIER: com.syncrozero.pro
    INFOPLIST_FILE: MiaoTing/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  MiaoTing:
    type: application
    platform: iOS
    sources:
      - path: MiaoTing
        excludes:
          - "Info.plist"
          - "Assets.xcassets"
    resources:
      - path: MiaoTing/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: MiaoTing/Info.plist
