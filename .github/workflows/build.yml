name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build .app (ad-hoc signed for linking)
        run: |
          # 用 ad-hoc 签名（-）让 Xcode 完成完整编译+链接
          # 不用 CODE_SIGNING_ALLOWED=NO，那会跳过 link 步骤
          xcodebuild build \
            -project MiaoTing.xcodeproj \
            -scheme MiaoTing \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            -destination "generic/platform=iOS" \
            2>&1 | tee build_output.log

      - name: Verify build output
        run: |
          echo "=== Searching for .app ==="
          find build/DerivedData -name "MiaoTing.app" -type d
          
          APP_PATH=$(find build/DerivedData -name "MiaoTing.app" -type d | head -1)
          echo "Found: $APP_PATH"
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in DerivedData"
            find build/DerivedData -type d -maxdepth 5 2>/dev/null
            exit 1
          fi
          
          echo "=== .app contents ==="
          ls -la "$APP_PATH"
          echo "=== Binary check ==="
          ls -la "$APP_PATH/MiaoTing" 2>/dev/null || echo "No binary found!"
          file "$APP_PATH/MiaoTing" 2>/dev/null || true

      - name: Create IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "MiaoTing.app" -type d | head -1)
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found"
            exit 1
          fi
          
          # 构建 IPA 结构
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/MiaoTing.app
          
          # 清除签名信息（让 lcsign 重新签）
          rm -rf build/Payload/MiaoTing.app/_CodeSignature 2>/dev/null || true
          rm -f build/Payload/MiaoTing.app/embedded.mobileprovision 2>/dev/null || true
          rm -f build/Payload/MiaoTing.app/_CodeSignature 2>/dev/null || true
          
          # 验证
          echo "=== Payload contents ==="
          ls -la build/Payload/MiaoTing.app/
          echo "=== Binary size ==="
          ls -la build/Payload/MiaoTing.app/MiaoTing 2>/dev/null || echo "WARNING: No binary"
          
          cd build
          zip -r MiaoTing-1.1.3-unsigned.ipa Payload
          echo "=== IPA created ==="
          ls -la MiaoTing-1.1.3-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiaoTing-1.1.3-unsigned
          path: build/MiaoTing-1.1.3-unsigned.ipa
          retention-days: 90

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_output.log
            build/
          retention-days: 7
