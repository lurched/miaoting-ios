name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List generated project
        run: |
          ls -la
          ls -la MiaoTing.xcodeproj/

      - name: Build archive (unsigned)
        run: |
          xcodebuild archive \
            -project MiaoTing.xcodeproj \
            -scheme MiaoTing \
            -configuration Release \
            -archivePath build/MiaoTing.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Export unsigned IPA
        run: |
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
                  <key>method</key>
                  <string>development</string>
                  <key>signingStyle</key>
                  <string>manual</string>
                  <key>provisioningProfiles</key>
                  <dict/>
                  <key>signingCertificate</key>
                  <string></string>
                  <key>stripSwiftSymbols</key>
                  <true/>
                  <key>compileBitcode</key>
                  <false/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/MiaoTing.xcarchive \
            -exportPath build/output \
            -exportOptionsPlist ExportOptions.plist \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Rename IPA
        run: |
          cd build/output
          ls -la
          IPA_FILE=$(find . -name "*.ipa" | head -1)
          if [ -n "$IPA_FILE" ]; then
            cp "$IPA_FILE" MiaoTing-1.1.3-unsigned.ipa
            echo "IPA: MiaoTing-1.1.3-unsigned.ipa"
            ls -la MiaoTing-1.1.3-unsigned.ipa
          else
            echo "No IPA found, listing output dir:"
            ls -la
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiaoTing-1.1.3-unsigned
          path: build/output/MiaoTing-1.1.3-unsigned.ipa
          retention-days: 90

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/
            *.log
          retention-days: 7
