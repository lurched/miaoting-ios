name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using: $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"

      - name: Print Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive (unsigned)
        run: |
          xcodebuild archive \
            -project MiaoTing.xcodeproj \
            -scheme MiaoTing \
            -configuration Release \
            -archivePath build/MiaoTing.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -destination "generic/platform=iOS" \
            2>&1 | tee build_output.log

      - name: Create IPA from archive
        run: |
          # 查看 archive 实际结构
          echo "=== Archive structure ==="
          find build/MiaoTing.xcarchive -name "*.app" -type d
          echo "=== Products dir ==="
          ls -la build/MiaoTing.xcarchive/Products/
          ls -la build/MiaoTing.xcarchive/Products/Applications/ 2>/dev/null || echo "No Applications dir"

          # 找到 .app 的实际路径
          APP_PATH=$(find build/MiaoTing.xcarchive -name "*.app" -type d | head -1)
          echo "Found app: $APP_PATH"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found in archive"
            exit 1
          fi

          # 手动构建 IPA
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/

          # 清除签名信息（让 lcsign 重新签）
          rm -rf build/Payload/MiaoTing.app/_CodeSignature 2>/dev/null || true
          rm -f build/Payload/MiaoTing.app/embedded.mobileprovision 2>/dev/null || true

          cd build
          zip -r MiaoTing-1.1.3-unsigned.ipa Payload
          echo "=== IPA created ==="
          ls -la MiaoTing-1.1.3-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiaoTing-1.1.3-unsigned
          path: build/MiaoTing-1.1.3-unsigned.ipa
          retention-days: 90

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_output.log
            build/
          retention-days: 7
